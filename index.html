<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Royal 4K Cyber Couture</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #e2b714;
            --gold-glow: rgba(226, 183, 20, 0.4);
            --cyan: #00f3ff;
            --glass: rgba(12, 16, 28, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #030508;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 20% 20%, rgba(226, 183, 20, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 40%);
            z-index: -2;
            pointer-events: none;
        }

        #light-tracker {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(226, 183, 20, 0.12) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%); z-index: -1; transition: 0.08s ease-out;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        header {
            position: sticky; top: 20px; z-index: 1000;
            max-width: 1400px; margin: 0 auto; padding: 18px 35px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand-logo {
            font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 900;
            letter-spacing: 4px; background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        nav ul { display: flex; list-style: none; gap: 30px; }
        nav a {
            color: #ccc; text-decoration: none; font-size: 0.95rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        nav a:hover, nav a.active { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }

        .nav-actions { display: flex; gap: 20px; align-items: center; }
        .action-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: #fff; width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative; transition: 0.4s;
        }
        .action-btn:hover { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); transform: scale(1.08); }
        .badge {
            position: absolute; top: -5px; right: -5px; background: var(--gold);
            color: #000; font-size: 0.75rem; font-weight: 800; width: 20px; height: 20px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
        }

        .hero-orbit-section {
            max-width: 1400px; margin: 40px auto; padding: 60px 20px;
            display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .orbit-container {
            position: relative; width: 440px; height: 440px;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        .orbit-ring {
            position: absolute; width: 100%; height: 100%;
            border: 2px dashed rgba(226, 183, 20, 0.3); border-radius: 50%;
            animation: rotateRing 25s linear infinite;
        }
        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .orbit-ring-text {
            position: absolute; width: 120%; height: 120%;
            border-radius: 50%; animation: rotateRing 35s linear infinite reverse;
            display: flex; justify-content: center; align-items: center;
        }
        .orbit-ring-text span {
            position: absolute; font-family: 'Cinzel', serif; font-size: 0.8rem;
            color: var(--gold); letter-spacing: 3px; font-weight: 700; text-transform: uppercase;
        }

        .central-product-card {
            width: 290px; height: 370px; position: relative;
            transform-style: preserve-3d; transition: transform 0.1s ease-out;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px var(--gold-glow);
        }
        .central-product-card img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .center-tag {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            padding: 8px 20px; border-radius: 30px; border: 1px solid var(--gold);
            font-family: 'Cinzel', serif; font-size: 0.85rem; color: #fff; text-align: center;
            white-space: nowrap;
        }

        .section-header {
            max-width: 1400px; margin: 60px auto 30px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .section-title h2 {
            font-family: 'Cinzel', serif; font-size: 2.5rem; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .category-filters { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-btn {
            background: transparent; border: 1px solid var(--glass-border); color: #aaa;
            padding: 10px 22px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--gold); color: #000; border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .products-grid {
            max-width: 1400px; margin: 0 auto; padding: 0 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 35px;
            perspective: 1200px;
        }

        .product-card {
            padding: 20px; border-radius: 24px; position: relative;
            transform-style: preserve-3d; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer; overflow: hidden;
        }
        .product-card:hover {
            transform: rotateY(10deg) rotateX(-5deg) translateY(-10px);
            border-color: var(--gold); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px var(--gold-glow);
        }

        .media-container {
            width: 100%; height: 350px; border-radius: 16px; overflow: hidden;
            position: relative; margin-bottom: 20px; background: #080c14;
        }
        .media-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .product-card:hover .media-container img { transform: scale(1.08); }

        .badge-360 {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.75);
            border: 1px solid var(--gold); color: var(--gold); font-size: 0.75rem;
            font-weight: 700; padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(5px);
        }

        .product-details h3 { font-family: 'Cinzel', serif; font-size: 1.25rem; margin-bottom: 6px; }
        .product-details p { color: #888; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.4; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .price { font-family: 'Cinzel', serif; font-size: 1.35rem; font-weight: 700; color: var(--gold); }
        .add-cart-btn {
            background: linear-gradient(135deg, var(--gold), #b89108);
            border: none; color: #000; padding: 12px 20px; border-radius: 12px;
            font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .add-cart-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold-glow); }

        .cart-modal {
            position: fixed; top: 0; right: -450px; width: 420px; height: 100vh;
            background: rgba(5, 8, 15, 0.95); backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border); z-index: 2000;
            padding: 30px; display: flex; flex-direction: column; transition: 0.5s ease;
        }
        .cart-modal.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .cart-items { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .cart-item {
            display: flex; gap: 15px; background: rgba(255,255,255,0.03);
            padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); align-items: center;
        }
        .cart-item img { width: 65px; height: 75px; object-fit: cover; border-radius: 8px; }
        .cart-checkout-btn {
            width: 100%; padding: 16px; background: var(--gold); border: none;
            color: #000; font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.1rem;
            border-radius: 12px; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .cart-checkout-btn:hover { box-shadow: 0 0 20px var(--gold-glow); }

        footer {
            max-width: 1400px; margin: 100px auto 30px; padding: 40px;
            text-align: center; border-top: 1px solid var(--glass-border);
        }
        .footer-sig {
            font-family: 'Cinzel', serif; font-size: 1.2rem; letter-spacing: 2px; color: #fff;
        }
        .footer-sig span { color: var(--gold); font-weight: 700; }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div id="light-tracker"></div>

    <header class="glass-panel">
        <div class="brand-logo">AURA</div>
        <nav>
            <ul>
                <li><a href="#" class="active" onclick="filterCategory('all', event)">Collections</a></li>
                <li><a href="#" onclick="filterCategory('suits', event)">Bespoke Suits</a></li>
                <li><a href="#" onclick="filterCategory('men', event)">Men</a></li>
                <li><a href="#" onclick="filterCategory('women', event)">Women</a></li>
                <li><a href="#" onclick="filterCategory('kids', event)">Kids</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <div class="action-btn" id="cart-toggle">
                <i class="fas fa-shopping-bag"></i>
                <div class="badge" id="cart-count">0</div>
            </div>
            <div class="action-btn" onclick="alert('Account Portal initialized.')">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </header>

    <!-- 360 Central Orbit Hero Showcase -->
    <section class="hero-orbit-section">
        <div class="orbit-container">
            <div class="orbit-ring"></div>
            
            <div class="orbit-ring-text">
                <span style="transform: rotate(0deg) translate(220px) rotate(0deg);">AURA 4K COUTURE</span>
                <span style="transform: rotate(90deg) translate(220px) rotate(-90deg);">ROYAL BESPOKE</span>
                <span style="transform: rotate(180deg) translate(220px) rotate(-180deg);">360 PRECISION</span>
                <span style="transform: rotate(270deg) translate(220px) rotate(-270deg);">ENG ABDELNASSER</span>
            </div>

            <div class="central-product-card glass-panel" id="hero-interactive-card">
                <!-- Image file set to 1779324090073 -->
                <img src="1779324090073.jpg" id="hero-img" alt="Central 360 Showcase" onerror="this.src='https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=800&q=80'">
                <div class="center-tag">Featured Royal Showcase • 360° View</div>
            </div>
        </div>
    </section>

    <div class="section-header">
        <div class="section-title">
            <h2>Featured Catalogue</h2>
        </div>
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterCategory('all', event)">All (20)</button>
            <button class="filter-btn" onclick="filterCategory('suits', event)">Bespoke Suits</button>
            <button class="filter-btn" onclick="filterCategory('men', event)">Men</button>
            <button class="filter-btn" onclick="filterCategory('women', event)">Women</button>
            <button class="filter-btn" onclick="filterCategory('kids', event)">Kids</button>
        </div>
    </div>

    <section class="products-grid" id="product-grid"></section>

    <!-- Shopping Cart Modal -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h2 style="font-family: 'Cinzel', serif;">Your Cart</h2>
            <div class="action-btn" id="cart-close"><i class="fas fa-times"></i></div>
        </div>
        <div class="cart-items" id="cart-items-container">
            <p style="color: #666; text-align: center; margin-top: 50px;">Your shopping bag is empty.</p>
        </div>
        <div style="border-top: 1px solid var(--glass-border); padding-top: 20px; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700;">
                <span>Total:</span>
                <span style="color: var(--gold);" id="cart-total">0 EGP</span>
            </div>
            <button class="cart-checkout-btn" onclick="alert('Proceeding to Checkout Portal...')">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Clean Footer Signature Only -->
    <footer class="glass-panel">
        <div class="footer-sig">
            Developed and Created by <span>Eng. Abdel Nasser</span>
        </div>
    </footer>

    <script>
        document.addEventListener('mousemove', (e) => {
            const tracker = document.getElementById('light-tracker');
            tracker.style.left = e.clientX + 'px';
            tracker.style.top = e.clientY + 'px';
        });

        // 20 Products Catalogue - Apparel & Clothes Display Only
        const products = [
            // Bespoke Suits (5 Items)
            { id: 1, name: 'Royal Italian Tuxedo Jacket', category: 'suits', price: 13500, desc: 'Handcrafted wool-silk blend blazer on hanger display.', img: 'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=800&q=80' },
            { id: 2, name: 'Classic Navy Blue Blazer', category: 'suits', price: 11200, desc: 'Tailored double-breasted suit blazer on hanger.', img: 'https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=800&q=80' },
            { id: 3, name: 'Bespoke Emerald Suit Vest', category: 'suits', price: 4800, desc: 'Tailored luxury velvet waistcoat display.', img: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=80' },
            { id: 4, name: 'Charcoal Wool Suit Trousers', category: 'suits', price: 3900, desc: 'Precision-pleated formal Italian trousers.', img: 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=800&q=80' },
            { id: 5, name: 'Midnight Black Tuxedo Jacket', category: 'suits', price: 12800, desc: 'Satin lapel tuxedo jacket display.', img: 'https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=800&q=80' },

            // Men's Wear (5 Items)
            { id: 6, name: 'Vintage Brown Leather Jacket', category: 'men', price: 8700, desc: 'Genuine leather biker jacket flat-lay display.', img: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=800&q=80' },
            { id: 7, name: 'Classic Camel Trench Coat', category: 'men', price: 9500, desc: 'Pure wool winter trench coat on hanger.', img: 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=800&q=80' },
            { id: 8, name: 'Egyptian Cotton Dress Shirt', category: 'men', price: 2400, desc: 'Folded crisp white oxford dress shirt.', img: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=800&q=80' },
            { id: 9, name: 'Denim Heritage Jacket', category: 'men', price: 3600, desc: 'Classic blue denim jacket hanger view.', img: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&w=800&q=80' },
            { id: 10, name: 'Cashmere Knit Sweater', category: 'men', price: 4200, desc: 'Minimalist folded cashmere sweater.', img: 'https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=800&q=80' },

            // Women's Wear (5 Items)
            { id: 11, name: 'Silk Evening Gown', category: 'women', price: 11800, desc: 'Haute couture silk dress display on hanger.', img: 'https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=800&q=80' },
            { id: 12, name: 'Tailored Women Coat', category: 'women', price: 10200, desc: 'Elegant winter coat display on hanger.', img: 'https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=800&q=80' },
            { id: 13, name: 'Silk Couture Blouse', category: 'women', price: 4600, desc: 'Soft pastel silk blouse flat-lay setup.', img: 'https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?auto=format&fit=crop&w=800&q=80' },
            { id: 14, name: 'Heavy Oversized Hoodie', category: 'women', price: 2800, desc: 'Premium cotton hoodie flat-lay.', img: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80' },
            { id: 15, name: 'Minimalist Crewneck Sweater', category: 'women', price: 3200, desc: 'Soft wool knit sweater display.', img: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=80' },

            // Kids Wear (5 Items)
            { id: 16, name: 'Junior Tailored Blazer', category: 'kids', price: 3200, desc: 'Miniature cotton-linen blazer display.', img: 'https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=800&q=80' },
            { id: 17, name: 'Kids Winter Fleece Jacket', category: 'kids', price: 2100, desc: 'Warm insulated fleece jacket display.', img: 'https://images.unsplash.com/photo-1519457431-44ccd64a579b?auto=format&fit=crop&w=800&q=80' },
            { id: 18, name: 'Kids Cotton Sweatshirt', category: 'kids', price: 1800, desc: 'Folded organic cotton pullover.', img: 'https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?auto=format&fit=crop&w=800&q=80' },
            { id: 19, name: 'Kids Graphic Tee', category: 'kids', price: 1200, desc: 'Flat-lay organic cotton t-shirt.', img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80' },
            { id: 20, name: 'Bespoke Wardrobe Collection', category: 'kids', price: 5500, desc: 'Organized rack collection display.', img: 'https://images.unsplash.com/photo-1558769132-cb1aea458e5e?auto=format&fit=crop&w=800&q=80' }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card glass-panel';
                card.innerHTML = `
                    <div class="media-container">
                        <span class="badge-360"><i class="fas fa-sync-alt"></i> 360° PREVIEW</span>
                        <img src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="product-details">
                        <h3>${item.name}</h3>
                        <p>${item.desc}</p>
                        <div class="card-footer">
                            <div class="price">${item.price.toLocaleString()} EGP</div>
                            <button class="add-cart-btn" onclick="addToCart(${item.id})">
                                <i class="fas fa-shopping-cart"></i> Add
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, e) {
            if(e) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
            }

            if (cat === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items-container');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; margin-top: 50px;">Your shopping bag is empty.</p>';
                totalEl.innerText = '0 EGP';
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, idx) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div style="flex-grow: 1;">
                        <h4 style="font-size: 0.95rem;">${item.name}</h4>
                        <p style="color: var(--gold); font-weight: 700; margin-top: 5px;">${item.price.toLocaleString()} EGP</p>
                    </div>
                    <i class="fas fa-trash" style="color: #ff4444; cursor: pointer;" onclick="removeFromCart(${idx})"></i>
                `;
                container.appendChild(div);
            });

            totalEl.innerText = total.toLocaleString() + ' EGP';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        document.getElementById('cart-toggle').addEventListener('click', () => {
            document.getElementById('cart-modal').classList.add('open');
        });
        document.getElementById('cart-close').addEventListener('click', () => {
            document.getElementById('cart-modal').classList.remove('open');
        });

        const centralCard = document.getElementById('hero-interactive-card');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 20;
            const y = (window.innerHeight / 2 - e.clientY) / 20;
            if(centralCard) {
                centralCard.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            }
        });

        renderProducts(products);
    </script>
</body>
</html>
