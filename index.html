<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASSER LUXURY | The Ultimate Fashion Brand</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #D4AF37;
            --dark-bg: #050505;
            --glass-bg: rgba(20, 20, 20, 0.7);
            --glass-border: rgba(212, 175, 55, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: #fff; overflow-x: hidden; }

        /* --- HERO VIDEO SECTION --- */
        .hero {
            position: relative;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            border-bottom: 2px solid var(--gold);
        }
        
        .hero video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            opacity: 0.4;
        }

        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), #050505);
            z-index: -1;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 5rem; font-weight: 900;
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .brand-slogan { color: #fff; font-size: 1.5rem; margin-top: 15px; letter-spacing: 2px; }

        /* --- FILTERS --- */
        .filters {
            display: flex; justify-content: center; gap: 15px;
            padding: 30px 20px; flex-wrap: wrap;
            position: sticky; top: 0;
            background: rgba(5,5,5,0.9); backdrop-filter: blur(10px);
            z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .filter-btn {
            background: transparent; color: #fff;
            border: 1px solid var(--gold); padding: 10px 30px;
            border-radius: 30px; font-size: 1.1rem; cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover { background: var(--gold); color: #000; font-weight: bold; }

        /* --- GRID & PRODUCTS --- */
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px;
        }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 15px;
            padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: 0.4s; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .glass-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2); }

        .image-container { perspective: 1000px; margin-bottom: 15px; border-radius: 10px; overflow: hidden; }
        .product-img {
            width: 100%; height: 350px; object-fit: cover; border-radius: 10px;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
        }
        
        /* THE 3D SPIN EFFECT */
        .glass-card:hover .product-img { transform: rotateY(360deg) scale(1.05); }

        .product-info { text-align: center; }
        .product-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .product-price { font-size: 1.5rem; font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 15px; font-weight: bold; }

        .btn {
            display: block; width: 100%; padding: 12px; border-radius: 8px;
            font-size: 1rem; font-weight: bold; text-decoration: none;
            text-align: center; transition: 0.3s; border: none; cursor: pointer; margin-bottom: 10px;
        }
        .btn-whatsapp {
            background: rgba(37, 211, 102, 0.15); color: #25D366; border: 1px solid #25D366;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-whatsapp:hover { background: #25D366; color: #000; }

        /* --- FOOTER --- */
        footer { margin-top: 60px; padding: 40px; text-align: center; background: rgba(0,0,0,0.9); border-top: 1px solid var(--glass-border); }
        .signature { padding: 20px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 10px; display: inline-block; }
        .signature h3 { font-size: 1rem; color: #ccc; }
        .signature .dev-name { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); margin: 10px 0; }
    </style>
</head>
<body>

    <!-- HERO SECTION WITH VIDEO -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <!-- فيديو عرض أزياء صامت في الخلفية (رابط خارجي مجاني) -->
        <video autoplay muted loop playsinline>
            <source src="https://cdn.pixabay.com/video/2016/09/21/5320-183786498_large.mp4" type="video/mp4">
        </video>
        <div style="z-index: 1;">
            <h1 class="brand-name">NASSER LUXURY</h1>
            <p class="brand-slogan">أناقة بلا حدود .. عالم من الفخامة الحصرية</p>
        </div>
    </section>

    <!-- CATEGORY FILTERS -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('all')">الكل (50)</button>
        <button class="filter-btn" onclick="filterProducts('men')">رجالي</button>
        <button class="filter-btn" onclick="filterProducts('women')">نسائي</button>
        <button class="filter-btn" onclick="filterProducts('kids')">أطفال</button>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="container">
        <div class="products-grid" id="productGrid">
            <!-- المنتجات هتتولد هنا برمجياً -->
        </div>
    </div>

    <!-- MANDATORY SIGNATURE FOOTER -->
    <footer>
        <div class="signature">
            <h3>Developed and Created by</h3>
            <div class="dev-name">Eng. Abdel Nasser</div>
            <h3 style="color: #888; font-size: 0.9rem;">Ramadan Kareem App Developer</h3>
        </div>
    </footer>

    <!-- DYNAMIC 50 PRODUCTS ENGINE -->
    <script>
        // قواميس بيانات لتوليد 50 منتج فخم ومنوع
        const categories = ['men', 'women', 'kids'];
        const itemNames = {
            'men': ['بدلة كلاسيك إيطالي', 'بليزر كاجوال', 'قميص أكسفورد', 'بنطلون قماش فاخر', 'جاكيت جلد طبيعي', 'توكسيدو ملكي', 'سويت شيرت شتوي', 'طقم كاجوال صيفي', 'كوتشي شبابي تريند'],
            'women': ['فستان سهرة مرصع', 'عباية خليجي مطرزة', 'بلوزة حرير', 'جاكيت جينز اوفر سايز', 'طقم خروج كلاسيك', 'كارديجان طويل', 'حقيبة يد فاخرة', 'بنطلون وايد ليج', 'فستان كاجوال نهاري'],
            'kids': ['طقم أطفال ولادي كامل', 'فستان بناتي منفوش', 'سالوبيت جينز', 'جاكيت أطفال شتوي', 'ترنج رياضي مريح', 'تيشيرت قطن', 'حذاء رياضي للأطفال', 'طقم العيد مميز']
        };
        const keywords = { 'men': 'menswear,suit', 'women': 'dress,womensfashion', 'kids': 'kidsclothes,child' };
        
        let allProducts = [];
        
        // توليد 50 منتج عشوائي متوزعين على الأقسام
        for(let i = 1; i <= 50; i++) {
            let cat = categories[i % 3]; // توزيع عادل بين الأقسام
            let nameList = itemNames[cat];
            let name = nameList[Math.floor(Math.random() * nameList.length)] + ` (إصدار ${i})`;
            let price = Math.floor(Math.random() * 5000) + 500; // سعر بين 500 و 5500
            
            // استخدام موقع صور عشوائية محترفة للملابس بناءً على الفئة
            let imgUrl = `https://loremflickr.com/500/700/${keywords[cat]}?lock=${i}`;

            allProducts.push({ id: i, category: cat, name: name, price: price, img: imgUrl });
        }

        const grid = document.getElementById('productGrid');
        const phone = "201098227150";

        // دالة عرض المنتجات
        function renderProducts(filterCat) {
            grid.innerHTML = '';
            let filtered = filterCat === 'all' ? allProducts : allProducts.filter(p => p.category === filterCat);
            
            filtered.forEach(product => {
                let msg = encodeURIComponent(`أهلاً NASSER LUXURY، مهتم بشراء (${product.name}) بسعر ${product.price} EGP`);
                
                let card = `
                    <div class="glass-card">
                        <div class="image-container">
                            <img src="${product.img}" alt="${product.name}" class="product-img" loading="lazy">
                        </div>
                        <div class="product-info">
                            <h2 class="product-title">${product.name}</h2>
                            <div class="product-price">${product.price.toLocaleString()} EGP</div>
                            <a href="https://wa.me/${phone}?text=${msg}" target="_blank" class="btn btn-whatsapp">
                                <i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> اطلب عبر واتساب
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // دالة تفاعل أزرار الفلترة
        function filterProducts(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(cat);
        }

        // تشغيل العرض الافتراضي (كل المنتجات)
        renderProducts('all');
    </script>
</body>
</html>
