<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASSER LUXURY | Premium Menswear</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #050505;
            --glass: rgba(15, 15, 15, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--dark-bg); color: #fff; overflow-x: hidden; }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gold); padding: 20px 0; text-align: center;
        }
        .brand-name {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900;
            color: var(--gold); text-transform: uppercase; letter-spacing: 5px;
        }

        /* --- HERO VIDEO --- */
        .hero {
            position: relative; height: 70vh; margin-top: 70px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-bottom: 2px solid var(--gold); background: #111;
        }
        .hero video {
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%); opacity: 0.5; object-fit: cover;
        }
        .hero-overlay {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(to top, var(--dark-bg), transparent); z-index: 1;
        }
        .hero-title { position: relative; z-index: 2; font-size: 4rem; font-weight: 900; letter-spacing: 10px; text-shadow: 0 5px 20px #000; }

        /* --- 3D ROTATING RING (الحلقة الدورانية) --- */
        .carousel-section {
            padding: 80px 0; text-align: center; background: #080808; overflow: hidden;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .section-title { font-size: 2rem; color: var(--gold); margin-bottom: 50px; letter-spacing: 3px; }
        
        .slider {
            position: relative; width: 280px; height: 380px; margin: 0 auto;
            perspective: 1200px; transform-style: preserve-3d;
        }
        .rotator {
            width: 100%; height: 100%; position: absolute; transform-style: preserve-3d;
            animation: spinRing 25s linear infinite;
        }
        .rotator:hover { animation-play-state: paused; } /* تقف لما الماوس ييجي عليها */
        
        .ring-item {
            position: absolute; width: 100%; height: 100%; left: 0; top: 0;
            border-radius: 10px; border: 2px solid var(--gold); overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); background: #000;
        }
        .ring-item img { width: 100%; height: 100%; object-fit: cover; }
        
        @keyframes spinRing {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* --- FILTERS --- */
        .filters {
            display: flex; justify-content: center; gap: 15px; padding: 40px 20px; flex-wrap: wrap;
        }
        .filter-btn {
            background: transparent; color: #fff; border: 1px solid var(--gold);
            padding: 10px 25px; border-radius: 4px; font-weight: bold; cursor: pointer;
            letter-spacing: 1px; transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--gold); color: #000; }

        /* --- PRODUCTS GRID --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }

        /* --- 3D CARDS --- */
        .glass-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 20px; text-align: center; transition: 0.4s;
            perspective: 1000px; /* لعمق الـ 3D */
        }
        .glass-card:hover { border-color: var(--gold); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15); }

        .image-container { perspective: 1200px; margin-bottom: 20px; }
        .product-img {
            width: 100%; height: 300px; object-fit: contain; border-radius: 8px; background: #111;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
        }
        
        /* حركة الـ 360 درجة رجعت هنا */
        .glass-card:hover .product-img { transform: rotateY(360deg); }

        .product-title { font-size: 1.2rem; font-weight: bold; color: #fff; text-transform: uppercase; }
        .product-desc { font-family: 'Cairo', sans-serif; font-size: 0.9rem; color: #888; margin: 10px 0; direction: rtl; }
        .product-price { font-size: 1.5rem; color: var(--gold); font-weight: bold; margin-bottom: 15px; }

        .btn {
            display: block; width: 100%; padding: 12px; border-radius: 4px; font-weight: bold;
            text-align: center; text-decoration: none; border: none; cursor: pointer; transition: 0.3s;
        }
        .btn-whatsapp { background: rgba(37, 211, 102, 0.1); color: #25D366; border: 1px solid #25D366; }
        .btn-whatsapp:hover { background: #25D366; color: #000; }

        /* --- FOOTER --- */
        footer { margin-top: 60px; padding: 40px; text-align: center; border-top: 1px solid var(--gold); }
        .signature { padding: 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: inline-block; }
        .signature h3 { font-size: 0.9rem; color: #666; letter-spacing: 2px; }
        .signature h2 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: #fff; margin: 10px 0; }
        .signature h2 span { color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">NASSER LUXURY</div>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div>
        <video autoplay muted loop playsinline poster="https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=1920&q=100">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-set-of-blazers-on-hangers-43709-large.mp4" type="video/mp4">
        </video>
        <h1 class="hero-title">MEN'S EXCLUSIVE</h1>
    </section>

    <!-- حلقة العرض الدورانية 3D -->
    <section class="carousel-section">
        <h2 class="section-title">PREMIUM HIGHLIGHTS</h2>
        <div class="slider">
            <div class="rotator" id="ring-container">
                <!-- هيتم إضافة الصور هنا برمجياً -->
            </div>
        </div>
    </section>

    <div class="filters">
        <button class="filter-btn active" onclick="_flt(this, 'all')">ALL ITEMS</button>
        <button class="filter-btn" onclick="_flt(this, 'suits')">SUITS & BLAZERS</button>
        <button class="filter-btn" onclick="_flt(this, 'pants')">PANTS</button>
        <button class="filter-btn" onclick="_flt(this, 'shoes')">SNEAKERS & SHOES</button>
    </div>

    <div class="container">
        <div class="products-grid" id="main-grid"></div>
    </div>

    <footer>
        <div class="signature">
            <h3>Engineered & Developed By</h3>
            <h2>Eng. <span>Abdel Nasser</span></h2>
            <h3 style="color: var(--gold);">Ramadan Kareem App Developer</h3>
        </div>
    </footer>

    <script>
        !function(){const _pn="201098227150",_g=document.getElementById("main-grid"),_r=document.getElementById("ring-container");let _dt=[];
        // بيانات 4K أصلية بدون موديلز وبأسعار معقولة للرجالي فقط
        const _src=[
            {c:"suits",n:"ROYAL BLACK SUIT",d:"بدلة سوداء رسمية 4K معروضة كقالب.",i:"https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=1080&q=100",bp:1800},
            {c:"suits",n:"NAVY BLUE BLAZER",d:"بليزر كحلي كلاسيك بخامات مستوردة.",i:"https://images.unsplash.com/photo-1592878904946-b3ce8ae243ce?auto=format&fit=crop&w=1080&q=100",bp:1200},
            {c:"pants",n:"CLASSIC TROUSERS",d:"بنطلون قماش فاخر تصميم مستقيم.",i:"https://images.unsplash.com/photo-1624378439575-d1ead6cb2d00?auto=format&fit=crop&w=1080&q=100",bp:450},
            {c:"pants",n:"CHINO PANTS",d:"بنطلون جابردين مريح وعملي.",i:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=1080&q=100",bp:550},
            {c:"shoes",n:"PREMIUM SNEAKERS",d:"كوتشي رجالي عصري بجودة 4K مفرغ.",i:"https://images.unsplash.com/photo-1614252232525-a111a4310115?auto=format&fit=crop&w=1080&q=100",bp:750},
            {c:"shoes",n:"OXFORD LEATHER SHOES",d:"حذاء كلاسيك جلد طبيعي بدون خلفية مزعجة.",i:"https://images.unsplash.com/photo-1595341888016-a392ef81b7de?auto=format&fit=crop&w=1080&q=100",bp:1100}
        ];
        
        // توليد 50 منتج رجالي
        for(let i=1;i<=50;i++){let t=_src[i%_src.length];_dt.push({id:i,cat:t.c,n:`${t.n} V.${i}`,d:t.d,i:t.i,p:t.bp+Math.floor(Math.random()*300)})}
        
        // رسم حلقة الـ 3D (بتاخد أول 8 منتجات بس)
        for(let i=0;i<8;i++){
            let ang=i*(360/8);
            _r.innerHTML+=`<div class="ring-item" style="transform: rotateY(${ang}deg) translateZ(350px);"><img src="${_dt[i].i}" alt="Item"></div>`;
        }

        // دالة الفلترة والشبكة
        window._flt=function(btn,cat){
            document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active"); _g.innerHTML="";
            let f="all"===cat?_dt:_dt.filter(x=>x.cat===cat);
            f.forEach(x=>{
                let m=encodeURIComponent(`Hello NASSER LUXURY, I want (${x.n}) for ${x.p} EGP`);
                _g.innerHTML+=`<div class="glass-card"><div class="image-container"><img src="${x.i}" alt="Mockup" class="product-img" loading="lazy"></div><div class="product-title">${x.n}</div><div class="product-desc">${x.d}</div><div class="product-price">${x.p} EGP</div><a href="https://wa.me/${_pn}?text=${m}" target="_blank" class="btn btn-whatsapp"><i class="fab fa-whatsapp"></i> ORDER NOW</a></div>`;
            });
        };
        window._flt(document.querySelector(".filter-btn"),"all");
        }();
    </script>
</body>
</html>
