<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASSER LUXURY | Premium Collection</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-gold: #ffdf00;
            --dark-bg: #030303;
            --glass-bg: rgba(15, 15, 15, 0.8);
            --border-glow: rgba(255, 223, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--dark-bg); color: #fff; overflow-x: hidden; }

        /* --- NEON GLOW HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glow);
            padding: 20px 0; text-align: center;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900;
            color: #fff; text-transform: uppercase; letter-spacing: 5px;
            animation: neonFlicker 2s infinite alternate;
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-gold), 0 0 40px var(--neon-gold), 0 0 80px var(--neon-gold);
            }
            20%, 24%, 55% { text-shadow: none; color: #555; }
        }

        /* --- HERO VIDEO SECTION --- */
        .hero {
            position: relative; height: 80vh; margin-top: 80px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-bottom: 2px solid var(--neon-gold);
        }
        
        .hero video {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%); z-index: -2; opacity: 0.5;
            object-fit: cover;
        }
        
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, var(--dark-bg) 5%, rgba(0,0,0,0.2) 100%); z-index: -1;
        }

        .hero-title { font-size: 4rem; font-weight: 700; letter-spacing: 10px; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }

        /* --- FILTERS --- */
        .filters {
            display: flex; justify-content: center; gap: 20px; padding: 40px 20px;
            flex-wrap: wrap; background: var(--dark-bg);
        }
        .filter-btn {
            background: transparent; color: #fff; border: 1px solid var(--neon-gold);
            padding: 12px 35px; border-radius: 5px; font-size: 1rem; cursor: pointer;
            letter-spacing: 2px; text-transform: uppercase; font-weight: 700; transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--neon-gold); color: #000; box-shadow: 0 0 20px var(--border-glow);
        }

        /* --- PROFESSIONAL GRID --- */
        .container { max-width: 1500px; margin: 0 auto; padding: 20px; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px; justify-content: center; align-items: start;
        }

        /* --- PRODUCT CARDS (MOCKUP STYLE) --- */
        .glass-card {
            background: var(--glass-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 20px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); transition: all 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-15px); border-color: var(--neon-gold);
            box-shadow: 0 20px 50px rgba(255, 223, 0, 0.15);
        }

        .image-container { perspective: 1200px; margin-bottom: 20px; overflow: visible; }
        
        .product-img {
            width: 100%; height: 380px; object-fit: contain; /* Contain to keep mockups intact */
            background: #111; border-radius: 8px;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        /* 3D ROTATION */
        .glass-card:hover .product-img { transform: rotateY(360deg) scale(1.08); }

        .product-title { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .product-desc { font-family: 'Cairo', sans-serif; font-size: 0.95rem; color: #aaa; margin-bottom: 15px; direction: rtl; line-height: 1.6; }
        .product-price { font-size: 1.6rem; color: var(--neon-gold); margin-bottom: 20px; font-weight: 700; font-family: 'Orbitron', sans-serif; }

        .btn {
            display: block; width: 100%; padding: 14px; border-radius: 5px;
            font-size: 1rem; font-weight: 700; text-decoration: none;
            text-align: center; transition: 0.3s; border: none; cursor: pointer; text-transform: uppercase; margin-bottom: 10px;
        }
        .btn-order { background: #fff; color: #000; }
        .btn-order:hover { background: var(--neon-gold); }
        .btn-whatsapp {
            background: rgba(37, 211, 102, 0.1); color: #25D366; border: 1px solid #25D366;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-whatsapp:hover { background: #25D366; color: #000; box-shadow: 0 0 15px rgba(37, 211, 102, 0.5); }

        /* --- FOOTER --- */
        footer { margin-top: 80px; padding: 50px 20px; text-align: center; background: #000; border-top: 1px solid var(--border-glow); }
        .signature { padding: 30px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; display: inline-block; }
        .signature h3 { font-size: 0.9rem; color: #666; text-transform: uppercase; letter-spacing: 2px; }
        .signature .dev-name { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #fff; margin: 15px 0; letter-spacing: 3px; }
        .signature .dev-name span { color: var(--neon-gold); }
    </style>
</head>
